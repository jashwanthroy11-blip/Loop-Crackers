        tailwind.config = {
            darkMode: 'class',
            theme: {

                    keyframes: {

                        textPrimary:   '#F8FAFC',
                        textSecondary: '#94A3B8',
                        success:       '#22C55E',
                        error:         '#EF4444',

                        // Full SaaS token set
                        saas: {
                            bg:               '#0F172A',

                            primary:          '#4F46E5',
                            'primary-hover':  '#4338CA',
                            'primary-light':  'rgba(79,70,229,0.15)',
                            secondary:        '#06B6D4',
                            'secondary-light':'rgba(6,182,212,0.15)',
                            text:             '#F8FAFC',
                            muted:            '#94A3B8',
                            success:          '#22C55E',
                            'success-light':  'rgba(34,197,94,0.15)',
                            error:            '#EF4444',
                            'error-light':    'rgba(239,68,68,0.15)',
                            warning:          '#F59E0B',

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --color-bg: #0F172A;
            --color-card: #1E293B;
            --color-primary: #4F46E5;
            --color-secondary: #06B6D4;

            --color-success: #22C55E;
            --color-error: #EF4444;
            --color-border: #334155;

        html, body { height: 100%; overflow: hidden; }
        body { background-color: #0F172A; }

</head>
<body class="font-sans antialiased bg-saas-bg text-saas-text flex justify-center min-h-screen">
    
    <div id="root" class="w-full flex justify-center h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CustomCursor = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const moveCursor = (e) => {
                    setPos({ x: e.clientX, y: e.clientY });
                    setIsVisible(true);
                };
                const hideCursor = () => setIsVisible(false);
                
                window.addEventListener('mousemove', moveCursor);
                window.addEventListener('mouseleave', hideCursor);
                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    window.removeEventListener('mouseleave', hideCursor);
                };
            }, []);

            return (
                <div 
                    className={`fixed pointer-events-none z-[9999] w-96 h-96 rounded-full bg-indigo-500/20 dark:bg-indigo-400/30 blur-[80px] mix-blend-screen transition-opacity duration-300 ${isVisible ? 'opacity-100' : 'opacity-0'}`}
                    style={{ 
                        transform: `translate3d(${pos.x - 192}px, ${pos.y - 192}px, 0)`,
                        willChange: 'transform'
                    }}
                />
            );
        };

        // Mock Data
        const mockJobs = [
            { id: 1, company: 'Spotify', logo: 'S', title: 'Senior Product Designer', location: 'Remote, US', type: 'Full-time', category: 'Design', salary: '$120k - $150k', openings: 3 },
            { id: 2, company: 'Google', logo: 'G', title: 'Frontend Engineer', location: 'Bangalore, IN', type: 'Full-time', category: 'Engineering', salary: '₹25L - ₹40L', openings: 5 },
            { id: 3, company: 'Amazon', logo: 'A', title: 'UX Researcher', location: 'Hyderabad, IN', type: 'Contract', category: 'Design', salary: '₹18L - ₹25L', openings: 2 },
            { id: 4, company: 'Notion', logo: 'N', title: 'Product Manager', location: 'Remote', type: 'Full-time', category: 'Product', salary: '$110k - $140k', openings: 1 },
            { id: 5, company: 'Stripe', logo: 'S', title: 'Growth Marketing Lead', location: 'Mumbai, IN', type: 'Full-time', category: 'Marketing', salary: '₹30L - ₹50L', openings: 4 },
        ];


        // Bottom Navigation Component
        const BottomNav = ({ activeTab, setActiveTab }) => {
            const navItems = [
                { id: 'home', icon: 'home', label: 'Home' },
                { id: 'companies', icon: 'building-2', label: 'Companies' },
                { id: 'tracking', icon: 'briefcase', label: 'Job Tracker' },
                { id: 'messages', icon: 'message-square', label: 'Messages' },
                { id: 'profile', icon: 'user', label: 'Profile' },
            ];

            return (
                <div className="w-full bg-saas-card border-t border-saas-border flex justify-around py-3 px-2 z-50">
                    {navItems.map(item => (
                        <button 
                            key={item.id} 
                            onClick={() => setActiveTab(item.id)}
                            className={`flex flex-col items-center gap-1 transition-colors duration-200 ${activeTab === item.id ? 'text-saas-primary' : 'text-saas-muted hover:text-saas-text'}`}
                        >
                            <i data-lucide={item.icon} className="w-6 h-6"></i>
                            <span className="text-[10px] font-medium">{item.label}</span>
                        </button>
                    ))}
                </div>
            );
        };

        // Desktop Sidebar Component
        const Sidebar = ({ activeTab, setActiveTab }) => {
            const menuItems = [
                { id: 'home', icon: 'home', label: 'Home Page' },
                { id: 'companies', icon: 'building-2', label: 'Companies' },
                { id: 'resume-maker', icon: 'file-text', label: 'Resume Maker' },
                { id: 'career-guidance', icon: 'compass', label: 'Career Guidance' },
                { id: 'prepare', icon: 'book-open', label: 'Prepare' },
                { id: 'tracking', icon: 'clipboard-list', label: 'Job Tracker', badge: 3 },
                { id: 'activities', icon: 'activity', label: 'Activities' },
                { id: 'performance', icon: 'bar-chart-2', label: 'Performance' },
                { id: 'messages', icon: 'mail', label: 'Mailbox' },
                { id: 'settings', icon: 'settings', label: 'Settings' },
                { id: 'service', icon: 'briefcase', label: 'Services' },
            ];

            return (
                <div className="w-64 bg-saas-card border-r border-saas-border flex flex-col h-full py-6">
                    <div className="px-6 flex items-center gap-3 mb-10">
                        <div className="w-10 h-10 bg-saas-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-saas-primary/20">
                            <i data-lucide="layers" className="w-6 h-6"></i>
                        </div>
                        <h1 className="font-sora text-xl font-bold text-saas-text">Loop Crackers</h1>
                    </div>
                    <div className="flex-1 px-4 space-y-1">
                        <p className="px-2 text-[10px] font-bold text-saas-muted uppercase tracking-wider mb-4">Menu</p>
                        {menuItems.map(item => (
                            <button 
                                key={item.id} 
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition-all duration-200 ${activeTab === item.id ? 'bg-saas-primary-light text-saas-primary font-semibold' : 'text-saas-muted hover:bg-saas-hover hover:text-saas-text'}`}
                            >
                                <div className="flex items-center gap-3">
                                    <i data-lucide={item.icon} className="w-5 h-5"></i>
                                    <span className="text-sm">{item.label}</span>
                                </div>
                                {item.badge && (
                                    <span className="w-5 h-5 bg-saas-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center">{item.badge}</span>
                                )}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // Desktop TopBar Component
        const TopBar = ({ setActiveTab }) => {
            return (
                <div className="h-16 bg-saas-card border-b border-saas-border flex items-center justify-between px-8">
                    <div className="relative w-96">
                        <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-saas-muted"></i>
                        <input type="text" placeholder="Search Contacts, Jobs..." className="w-full bg-saas-bg border border-saas-border rounded-xl py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-saas-primary/50 outline-none text-saas-text placeholder-saas-muted" />
                    </div>
                    <div className="flex items-center gap-4">
                        <button className="text-saas-muted hover:text-saas-secondary transition-colors"><i data-lucide="bell" className="w-5 h-5"></i></button>
                        <button onClick={() => setActiveTab('settings')} className="text-saas-muted hover:text-saas-secondary transition-colors"><i data-lucide="settings" className="w-5 h-5"></i></button>
                    </div>
                </div>
            );
        };

        // Mobile Side Drawer Component
        const MobileDrawer = ({ isOpen, onClose, setActiveTab }) => {
            const menuItems = [
                { id: 'recommended', icon: 'zap', label: 'Recommended Jobs', tab: 'home' },
                { id: 'saved', icon: 'bookmark', label: 'Saved Jobs', tab: 'home' },
                { id: 'performance', icon: 'bar-chart-2', label: 'Profile Performance', tab: 'performance' },
                { id: 'display', icon: 'monitor', label: 'Display Performance', tab: 'performance' },
                { id: 'help', icon: 'help-circle', label: 'Chat for Help', tab: 'messages' },
                { id: 'settings', icon: 'settings', label: 'Settings', tab: 'settings' },
                { id: 'service', icon: 'briefcase', label: 'Services', tab: 'service' },
                { id: 'how-it-works', icon: 'info', label: 'How App Works', tab: 'home' },
            ];

            useEffect(() => {
                if (isOpen) lucide.createIcons();
            }, [isOpen]);

            return (
                <>
                    <div 
                        className={`fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] transition-opacity duration-300 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                        onClick={onClose}
                    ></div>
                    <div className={`fixed top-0 left-0 bottom-0 w-80 bg-saas-card z-[110] transition-transform duration-500 transform ${isOpen ? 'translate-x-0' : '-translate-x-full'} shadow-[20px_0_60px_-15px_rgba(0,0,0,0.6)] overflow-y-auto border-r border-saas-border`}>
                        <div className="p-6 border-b border-saas-border flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-saas-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-saas-primary/20">
                                    <i data-lucide="layers" className="w-6 h-6"></i>
                                </div>
                                <h1 className="font-sora text-xl font-bold text-saas-text">Loop Crackers</h1>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-saas-hover rounded-xl transition-colors">
                                <i data-lucide="x" className="w-6 h-6 text-saas-muted"></i>
                            </button>
                        </div>
                        <div className="p-4 space-y-1">
                            <p className="px-4 text-[10px] font-bold text-saas-muted uppercase tracking-widest mb-3">Quick Access</p>
                            {menuItems.map((item) => (
                                <button 
                                    key={item.id}
                                    onClick={() => { 
                                        setActiveTab(item.tab);
                                        onClose(); 
                                    }}
                                    className="w-full flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-saas-hover transition-all text-left group"
                                >
                                    <div className="w-9 h-9 bg-saas-bg rounded-lg flex items-center justify-center text-saas-muted group-hover:text-saas-secondary transition-colors">
                                        <i data-lucide={item.icon} className="w-4 h-4"></i>
                                    </div>
                                    <span className="font-medium text-sm text-saas-muted group-hover:text-saas-text transition-colors">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </>
            );
        };

        // Screen 1: Home Feed
        const HomeFeed = ({ navigateToJob, isMobileView }) => {
            const categories = ['All', 'Design', 'Engineering', 'Product', 'Marketing'];
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);

            // Access setActiveTab via window event as a simple way for this architecture
            const handleNavigate = (tab) => {
                window.dispatchEvent(new CustomEvent('navigate', { detail: tab }));
            };

            const filteredJobs = mockJobs.filter(job => {
                const matchesCategory = selectedCategory === 'All' || job.category === selectedCategory;
                const matchesSearch = job.title.toLowerCase().includes(searchQuery.toLowerCase()) || job.company.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="flex-1 overflow-y-auto bg-saas-bg">
                    <MobileDrawer isOpen={isDrawerOpen} onClose={() => setIsDrawerOpen(false)} setActiveTab={handleNavigate} />
                    
                    <div className="px-5 pt-8 pb-4 bg-saas-bg sticky top-0 z-10 flex justify-between items-center border-b border-saas-border">
                        <div className="flex items-center gap-4">
                            <button 
                                onClick={() => setIsDrawerOpen(true)}
                                className="w-9 h-9 bg-saas-card rounded-lg flex items-center justify-center text-saas-muted hover:text-saas-text border border-saas-border hover:border-saas-primary/50 transition-all"
                            >
                                <i data-lucide="menu" className="w-5 h-5"></i>
                            </button>
                            <div>
                                <p className="text-saas-muted text-[10px] uppercase font-bold tracking-widest">Hello</p>
                                <h1 className="font-sora text-lg font-bold text-saas-text leading-tight">Alex Kumar</h1>
                            </div>
                        </div>
                        <div className="w-9 h-9 bg-saas-primary rounded-lg flex items-center justify-center font-sora font-bold text-white text-xs cursor-pointer hover:bg-saas-primary-hover transition-colors" onClick={() => handleNavigate('profile')}>AK</div>
                    </div>
                    
                    <div className="px-5 mt-4">
                        <div className="relative">
                            <i data-lucide="search" className="absolute left-4 top-3 w-4 h-4 text-saas-muted"></i>
                            <input type="text" placeholder="Search for jobs..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-saas-card border border-saas-border rounded-xl py-2.5 pl-11 pr-4 focus:ring-2 focus:ring-saas-primary/50 outline-none text-sm text-saas-text placeholder-saas-muted transition-all" />
                        </div>
                    </div>

                    <div className="mt-5 pl-5 flex gap-2 overflow-x-auto hide-scrollbar">
                        {categories.map((cat, i) => (
                            <button key={i} onClick={() => setSelectedCategory(cat)} className={`whitespace-nowrap px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-200 ${selectedCategory === cat ? 'bg-saas-primary text-white shadow-lg shadow-saas-primary/30' : 'bg-saas-card text-saas-muted border border-saas-border hover:border-saas-primary/50 hover:text-saas-text'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="mt-6 px-5 pb-6">
                        <h2 className="font-sora text-base font-bold mb-4 animate-fade-in text-saas-text">Recommended Jobs</h2>
                        <div className={`grid ${isMobileView ? 'grid-cols-1 gap-3' : 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4'}`}>
                            {filteredJobs.length === 0 && <p className="text-saas-muted text-sm text-center py-4 col-span-full">No jobs found matching your criteria.</p>}
                            {filteredJobs.map((job, idx) => (
                                <div 
                                    key={job.id} 
                                    onClick={() => navigateToJob(job)} 
                                    className="bg-[#FFF5EB] p-4 md:p-5 rounded-xl border border-orange-200 flex flex-col justify-between gap-3 md:gap-4 cursor-pointer animate-slide-up hover:border-orange-400 hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(251,146,60,0.25)] transition-all duration-300"
                                    style={{ animationDelay: `${idx * 80}ms` }}
                                >
                                    <div className="flex justify-between items-start">
                                        <div className="flex gap-2 md:gap-3 items-center">
                                            <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-white border border-orange-200 flex items-center justify-center font-sora font-bold text-lg md:text-xl text-orange-600 shadow-sm">
                                                {job.logo}
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="font-sora font-bold text-[13px] md:text-[15px] text-gray-900 leading-tight mb-1">{job.title}</h3>
                                                <p className="text-[10px] md:text-xs font-medium text-gray-600">{job.company}</p>
                                            </div>
                                        </div>
                                        <button className="w-7 h-7 md:w-8 md:h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 hover:bg-orange-200 hover:text-orange-600 transition-colors flex-shrink-0">
                                            <i data-lucide="bookmark" className="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-col gap-1.5 md:gap-2 mt-1">
                                        <div className="flex items-center gap-1.5 md:gap-2 text-[10px] md:text-xs text-gray-600 font-medium">
                                            <i data-lucide="map-pin" className="w-3 h-3 md:w-3.5 md:h-3.5 text-orange-400"></i>
                                            {job.location}
                                        </div>
                                        <div className="flex gap-2 md:gap-4 text-[10px] md:text-xs font-semibold mt-1">
                                            <span className="flex items-center gap-1 text-green-700 bg-green-100 px-1.5 py-0.5 md:px-2 md:py-1 rounded-md"><i data-lucide="dollar-sign" className="w-2.5 h-2.5 md:w-3 md:h-3"></i> {job.salary}</span>
                                            <span className="flex items-center gap-1 text-orange-700 bg-orange-100 px-1.5 py-0.5 md:px-2 md:py-1 rounded-md"><i data-lucide="users" className="w-2.5 h-2.5 md:w-3 md:h-3"></i> {job.openings} Openings</span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-2 mt-1 md:mt-2 pt-3 md:pt-4 border-t border-orange-200/60">
                                        <span className="px-2 py-1 md:px-3 md:py-1.5 bg-white border border-orange-200 text-gray-700 rounded-md md:rounded-lg text-[9px] md:text-[10px] font-bold uppercase tracking-wider">{job.type}</span>
                                        <span className="px-2 py-1 md:px-3 md:py-1.5 bg-orange-100 text-orange-700 rounded-md md:rounded-lg text-[9px] md:text-[10px] font-bold uppercase tracking-wider">{job.category}</span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <h2 className="font-sora text-base font-bold mt-8 mb-4 animate-fade-in text-saas-text">More Resources</h2>
                        <div className={`grid ${isMobileView ? 'grid-cols-1' : 'grid-cols-1 sm:grid-cols-3'} gap-3 pb-6`}>
                            <div onClick={() => handleNavigate('resume-maker')} className="bg-gradient-to-br from-saas-primary to-saas-secondary p-4 rounded-xl text-white cursor-pointer hover:opacity-90 transition-opacity shadow-lg shadow-saas-primary/20">
                                <i data-lucide="file-text" className="w-6 h-6 mb-2"></i>
                                <h3 className="font-sora font-bold text-sm">Resume Maker</h3>

                            </div>

                                <h3 className="font-sora font-bold text-sm text-gray-900">Career Guidance</h3>
                                <p className="text-[10px] text-gray-600 mt-1 font-medium">Get expert advice for your career path</p>
                            </div>

                                <i data-lucide="book-open" className="w-6 h-6 mb-2 text-orange-500"></i>
                                <h3 className="font-sora font-bold text-sm text-gray-900">Prepare</h3>
                                <p className="text-[10px] text-gray-600 mt-1 font-medium">Mock exams & coding questions</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Screen 2: Job Detail
        const JobDetail = ({ job, goBack, onApply, hasApplied }) => {
            const [showModal, setShowModal] = useState(false);
            const [resumeName, setResumeName] = useState('');
            const [details, setDetails] = useState({ name: 'Alex Kumar', email: 'alex@example.com' });

            const handleApply = () => {
                onApply(job.id);
                setShowModal(false);
            };

            return (
                <div className="flex-1 bg-saas-bg flex flex-col h-full z-50 absolute w-full inset-0">
                    <div className="px-5 py-4 flex justify-between items-center sticky top-0 bg-saas-bg/90 backdrop-blur-md z-10 border-b border-saas-border">
                        <button onClick={goBack} className="w-9 h-9 border border-saas-border rounded-lg flex items-center justify-center text-saas-muted hover:text-saas-text hover:border-saas-primary/50 transition-all">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i>
                        </button>

                                className="flex-1 bg-saas-card text-saas-text rounded-xl px-4 py-2.5 border border-saas-border outline-none focus:ring-2 focus:ring-saas-primary/50 placeholder-saas-muted"
