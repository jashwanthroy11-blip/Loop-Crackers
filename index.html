<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Flow</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sora: ['Sora', 'sans-serif'],
                        sans: ['DM Sans', 'sans-serif'],
                    },
                    keyframes: {
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'slide-up': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'fade-in': 'fade-in 0.5s ease-out forwards',
                        'slide-up': 'slide-up 0.5s ease-out forwards',
                    },
                    colors: {
                        indigo: {
                            600: '#7C3AED',
                        },
                        teal: {
                            50: '#F0FDFA',
                            700: '#0F766E',
                            500: '#10B981',
                        },
                        yellow: {
                            400: '#FBBF24',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #F9FAFB; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-100 dark:bg-gray-900 flex justify-center min-h-screen transition-colors duration-300">
    
    <div id="root" class="w-full flex justify-center min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CustomCursor = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const moveCursor = (e) => {
                    setPos({ x: e.clientX, y: e.clientY });
                    setIsVisible(true);
                };
                const hideCursor = () => setIsVisible(false);
                
                window.addEventListener('mousemove', moveCursor);
                window.addEventListener('mouseleave', hideCursor);
                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    window.removeEventListener('mouseleave', hideCursor);
                };
            }, []);

            return (
                <div 
                    className={`fixed pointer-events-none z-[9999] w-96 h-96 rounded-full bg-indigo-500/20 dark:bg-indigo-400/30 blur-[80px] mix-blend-screen transition-opacity duration-300 ${isVisible ? 'opacity-100' : 'opacity-0'}`}
                    style={{ 
                        transform: `translate3d(${pos.x - 192}px, ${pos.y - 192}px, 0)`,
                        willChange: 'transform'
                    }}
                />
            );
        };

        // Mock Data
        const mockJobs = [
            { id: 1, company: 'Spotify', logo: 'S', title: 'Senior Product Designer', location: 'Remote, US', type: 'Full-time', category: 'Design' },
            { id: 2, company: 'Google', logo: 'G', title: 'Frontend Engineer', location: 'Bangalore, IN', type: 'Full-time', category: 'Engineering' },
            { id: 3, company: 'Amazon', logo: 'A', title: 'UX Researcher', location: 'Hyderabad, IN', type: 'Contract', category: 'Design' },
            { id: 4, company: 'Notion', logo: 'N', title: 'Product Manager', location: 'Remote', type: 'Full-time', category: 'Product' },
            { id: 5, company: 'Stripe', logo: 'S', title: 'Growth Marketing Lead', location: 'Mumbai, IN', type: 'Full-time', category: 'Marketing' },
        ];


        // Bottom Navigation Component
        const BottomNav = ({ activeTab, setActiveTab }) => {
            const navItems = [
                { id: 'home', icon: 'home', label: 'Home' },
                { id: 'tracking', icon: 'briefcase', label: 'Applied' },
                { id: 'messages', icon: 'message-square', label: 'Messages' },
                { id: 'contacts', icon: 'users', label: 'Contacts' },
                { id: 'profile', icon: 'user', label: 'Profile' },
            ];

            return (
                <div className="absolute bottom-0 w-full bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 flex justify-around py-3 px-2 z-50 transition-colors duration-300">
                    {navItems.map(item => (
                        <button 
                            key={item.id} 
                            onClick={() => setActiveTab(item.id)}
                            className={`flex flex-col items-center gap-1 ${activeTab === item.id ? 'text-pink-500' : 'text-gray-400'}`}
                        >
                            <i data-lucide={item.icon} className="w-6 h-6"></i>
                            <span className="text-[10px] font-medium">{item.label}</span>
                        </button>
                    ))}
                </div>
            );
        };

        // Desktop Sidebar Component
        const Sidebar = ({ activeTab, setActiveTab }) => {
            const menuItems = [
                { id: 'home', icon: 'layout-dashboard', label: 'Team dashboard' },
                { id: 'contacts', icon: 'users', label: 'Contacts' },
                { id: 'home', icon: 'briefcase', label: 'Jobs' },
                { id: 'tracking', icon: 'clipboard-list', label: 'Job requests', badge: 3 },
                { id: 'activities', icon: 'activity', label: 'Activities' },
                { id: 'performance', icon: 'bar-chart-2', label: 'Performance' },
                { id: 'messages', icon: 'mail', label: 'Mailbox' },
                { id: 'contacts', icon: 'users', label: 'Contacts' },
            ];

            return (
                <div className="w-64 bg-white dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 flex flex-col h-full py-6 transition-colors duration-300">
                    <div className="px-6 flex items-center gap-3 mb-10">
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                            <i data-lucide="layers" className="w-6 h-6"></i>
                        </div>
                        <h1 className="font-sora text-xl font-bold text-gray-900 dark:text-white">Align Flow</h1>
                    </div>
                    
                    <div className="flex-1 px-4 space-y-2">
                        <p className="px-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-4">Menu</p>
                        {menuItems.map(item => (
                            <button 
                                key={item.id} 
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition-all duration-200 ${activeTab === item.id ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700/50'}`}
                            >
                                <div className="flex items-center gap-3">
                                    <i data-lucide={item.icon} className="w-5 h-5"></i>
                                    <span className="text-sm">{item.label}</span>
                                </div>
                                {item.badge && (
                                    <span className="w-5 h-5 bg-indigo-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">{item.badge}</span>
                                )}
                            </button>
                        ))}
                    </div>

                    <div className="px-6 mt-auto">
                        <div className="bg-indigo-50 dark:bg-indigo-900/30 p-4 rounded-2xl">
                            <p className="text-xs text-indigo-600 dark:text-indigo-400 font-medium mb-2">Upgrade your plan</p>
                            <p className="text-[10px] text-gray-500 dark:text-gray-400 leading-relaxed">Get access to more features and data.</p>
                        </div>
                    </div>
                </div>
            );
        };

        // Desktop TopBar Component
        const TopBar = () => {
            return (
                <div className="h-16 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between px-8 transition-colors duration-300">
                    <div className="relative w-96">
                        <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                        <input type="text" placeholder="Search Contacts, Jobs..." className="w-full bg-gray-50 dark:bg-gray-700 border-none rounded-xl py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-indigo-100 outline-none dark:text-white" />
                    </div>
                    
                    <div className="flex items-center gap-6">
                        <button className="text-gray-400 hover:text-indigo-600 transition-colors"><i data-lucide="bell" className="w-5 h-5"></i></button>
                        <button className="text-gray-400 hover:text-indigo-600 transition-colors"><i data-lucide="settings" className="w-5 h-5"></i></button>
                        <div className="flex items-center gap-3 pl-4 border-l border-gray-100 dark:border-gray-700">
                            <div className="w-8 h-8 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center font-bold text-indigo-700 dark:text-indigo-400 text-xs">ST</div>
                            <div className="flex flex-col">
                                <span className="text-xs font-bold text-gray-900 dark:text-white">Sarah Thompson</span>
                                <span className="text-[10px] text-gray-500 dark:text-gray-400">Recruiter</span>
                            </div>
                            <i data-lucide="chevron-down" className="w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            );
        };

        // Screen 1: Home Feed
        const HomeFeed = ({ navigateToJob }) => {
            const categories = ['All', 'Design', 'Engineering', 'Product', 'Marketing'];
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');

            const filteredJobs = mockJobs.filter(job => {
                const matchesCategory = selectedCategory === 'All' || job.category === selectedCategory;
                const matchesSearch = job.title.toLowerCase().includes(searchQuery.toLowerCase()) || job.company.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="flex-1 overflow-y-auto pb-20">
                    <div className="px-6 pt-10 pb-4 bg-white dark:bg-gray-900 sticky top-0 z-10 flex justify-between items-center transition-colors duration-300">
                        <div>
                            <p className="text-gray-500 text-sm mb-1">Good morning</p>
                            <h1 className="font-sora text-xl font-bold text-gray-900 dark:text-white">Alex Kumar</h1>
                        </div>
                        <div className="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center font-sora font-bold text-gray-500 text-lg border-2 border-indigo-100 cursor-pointer" onClick={() => window.dispatchEvent(new CustomEvent('navigate', {detail: 'profile'}))}>AK</div>
                    </div>
                    
                    <div className="px-6 mt-2">
                        <div className="relative">
                            <i data-lucide="search" className="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                            <input type="text" placeholder="Search for jobs..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-white dark:bg-gray-800 rounded-2xl py-3 pl-12 pr-4 shadow-sm border-none focus:ring-2 focus:ring-indigo-100 outline-none text-sm dark:text-white transition-colors duration-300" />
                        </div>
                    </div>

                    <div className="mt-6 pl-6 flex gap-3 overflow-x-auto hide-scrollbar">
                        {categories.map((cat, i) => (
                            <button key={i} onClick={() => setSelectedCategory(cat)} className={`whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-medium transition-colors duration-300 ${selectedCategory === cat ? 'bg-gradient-to-r from-pink-400 to-yellow-400 text-white shadow-md shadow-pink-200' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="mt-8 px-6">
                        <h2 className="font-sora text-lg font-bold mb-4 animate-fade-in text-gray-900 dark:text-white">Recommended Jobs</h2>
                        <div className="flex flex-col gap-4">
                            {filteredJobs.length === 0 && <p className="text-gray-500 text-sm text-center py-4">No jobs found matching your criteria.</p>}
                            {filteredJobs.map((job, idx) => (
                                <div 
                                    key={job.id} 
                                    onClick={() => navigateToJob(job)} 
                                    className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 flex flex-col gap-4 cursor-pointer animate-slide-up hover:-translate-y-1 hover:shadow-md transition-all duration-300"
                                    style={{ animationDelay: `${idx * 100}ms` }}
                                >
                                    <div className="flex justify-between items-start">
                                        <div className="flex gap-4 items-center">
                                            <div className="w-12 h-12 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center font-sora font-bold text-xl text-gray-800 dark:text-white transition-colors">
                                                {job.logo}
                                            </div>
                                            <div>
                                                <h3 className="font-sora font-bold text-gray-900">{job.title}</h3>
                                                <p className="text-sm text-gray-500">{job.company} • {job.location}</p>
                                            </div>
                                        </div>
                                        <i data-lucide="bookmark" className="w-5 h-5 text-gray-300"></i>
                                    </div>
                                    <div className="flex justify-between items-center mt-2">
                                        <div className="flex gap-2">
                                            <span className="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg text-xs font-medium transition-colors">{job.type}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Screen 2: Job Detail
        const JobDetail = ({ job, goBack, onApply, hasApplied }) => {
            const [showModal, setShowModal] = useState(false);
            const [resumeName, setResumeName] = useState('');
            const [details, setDetails] = useState({ name: 'Alex Kumar', email: 'alex@example.com' });

            const handleApply = () => {
                onApply(job.id);
                setShowModal(false);
            };

            return (
                <div className="flex-1 bg-white dark:bg-gray-900 flex flex-col h-full z-50 absolute w-full inset-0 transition-colors duration-300">
                    <div className="px-6 py-6 flex justify-between items-center sticky top-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-10 transition-colors duration-300">
                        <button onClick={goBack} className="w-10 h-10 border border-gray-200 rounded-full flex items-center justify-center text-gray-600">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        </button>
                        <div className="flex gap-3">
                             <button className="w-10 h-10 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700">
                                 <i data-lucide="heart" className="w-5 h-5"></i>
                             </button>
                             <button className="w-10 h-10 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-700">
                                 <i data-lucide="share" className="w-5 h-5"></i>
                             </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto pb-24 px-6">
                        <div className="flex flex-col items-center text-center mt-4 animate-fade-in">
                            <div className="w-20 h-20 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center font-sora font-bold text-3xl text-gray-800 dark:text-white shadow-sm border border-gray-50 dark:border-gray-700 mb-4 transition-colors">
                                {job.logo}
                            </div>
                            <h1 className="font-sora text-2xl font-bold text-gray-900 mb-1">{job.title}</h1>
                            <p className="text-gray-500 mb-4">{job.company} • {job.location}</p>
                            <div className="flex gap-2">
                                 <span className="px-4 py-1.5 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 rounded-full text-sm font-medium">{job.type}</span>
                            </div>
                        </div>

                        <div className="mt-8 animate-slide-up" style={{ animationDelay: '100ms' }}>
                            <h2 className="font-sora text-lg font-bold mb-3 text-gray-900">About the role</h2>
                            <p className="text-gray-600 text-sm leading-relaxed mb-6">
                                We are looking for a highly skilled {job.title} to join our dynamic team. You will be responsible for creating intuitive, engaging, and scalable experiences for our users.
                            </p>

                            <h2 className="font-sora text-lg font-bold mb-3 text-gray-900">Responsibilities</h2>
                            <ul className="text-gray-600 text-sm leading-relaxed list-disc pl-5 flex flex-col gap-2">
                                <li>Collaborate with cross-functional teams to define, design, and ship new features.</li>
                                <li>Work on bug fixing and improving application performance.</li>
                                <li>Continuously discover, evaluate, and implement new technologies.</li>
                            </ul>
                        </div>
                    </div>

                    <div className="absolute bottom-0 w-full p-6 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 z-20 transition-colors duration-300">
                        {hasApplied ? (
                            <button disabled className="w-full bg-gray-300 text-gray-600 font-medium text-lg py-4 rounded-2xl cursor-not-allowed">
                                Already Applied
                            </button>
                        ) : (
                            <button onClick={() => setShowModal(true)} className="w-full bg-gradient-to-r from-pink-400 to-yellow-400 text-white font-medium text-lg py-4 rounded-2xl shadow-lg shadow-pink-200">
                                Apply Now
                            </button>
                        )}
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 z-[100] bg-black/50 flex items-end sm:items-center justify-center backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 pb-10 animate-slide-up transition-colors duration-300">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="font-sora text-xl font-bold text-gray-900">Apply for {job.title}</h2>
                                    <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-gray-600"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-gray-500 font-medium">Full Name</label>
                                        <input type="text" value={details.name} onChange={e => setDetails({...details, name: e.target.value})} className="w-full p-3 bg-gray-50 text-gray-900 rounded-xl mt-1 border border-gray-200 focus:ring-2 focus:ring-indigo-100 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 font-medium">Email Address</label>
                                        <input type="email" value={details.email} onChange={e => setDetails({...details, email: e.target.value})} className="w-full p-3 bg-gray-50 text-gray-900 rounded-xl mt-1 border border-gray-200 focus:ring-2 focus:ring-indigo-100 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 font-medium">Resume (PDF)</label>
                                        <div className="w-full p-4 border-2 border-dashed border-gray-200 rounded-xl mt-1 flex flex-col items-center justify-center text-gray-400 relative bg-gray-50 hover:bg-gray-100 transition-colors">
                                            <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => setResumeName(e.target.files[0]?.name)} />
                                            <i data-lucide="upload-cloud" className="w-8 h-8 mb-2"></i>
                                            <span className="text-sm font-medium text-gray-600">{resumeName || 'Tap to upload resume'}</span>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={handleApply} className="w-full bg-gradient-to-r from-pink-400 to-yellow-400 text-white font-medium text-lg py-4 rounded-2xl mt-8 shadow-lg shadow-pink-200 hover:bg-indigo-700 transition-colors">
                                    Submit Application
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Screen 3: Application Tracking
        const ApplicationTracking = ({ appliedJobs, isMobileView }) => {
            const stages = ['Applied', 'Screening', 'Interview', 'Selected', 'Offer'];
            const [tab, setTab] = useState('Active');
            
            const activeApps = [
                { id: 101, name: 'William Smith', title: 'Sr. Marketing Manager', company: 'Spotify', logo: 'S', stage: 0, tags: ['LinkedIn', 'Active'] },
                { id: 102, name: 'Isabella Anderson', title: 'Growth Marketer', company: 'Google', logo: 'G', stage: 1, tags: ['Scheduled'] },
                { id: 103, name: 'Alexander Jackson', title: 'SEO Specialist', company: 'Amazon', logo: 'A', stage: 2, tags: ['Video'] },
                { id: 104, name: 'Olivia Martinez', title: 'Marketing VP', company: 'Netflix', logo: 'N', stage: 3, tags: ['Scheduled'] },
                { id: 105, name: 'Noah Brown', title: 'Head of Marketing', company: 'Apple', logo: 'A', stage: 4, tags: ['Offered'] },
                ...appliedJobs.map(id => {
                    const job = mockJobs.find(j => j.id === id);
                    return { id, name: 'Alex Kumar', title: job.title, company: job.company, logo: job.logo, stage: 0, tags: ['New'] };
                })
            ];

            const archivedApps = [
                { id: 201, name: 'Elijah Thomas', title: 'Marketing Manager', company: 'Meta', logo: 'M', stage: 4, rejected: true },
            ];

            const displayApps = tab === 'Active' ? activeApps : archivedApps;

            if (!isMobileView && tab === 'Active') {
                return (
                    <div className="flex-1 flex flex-col h-full bg-[#F9FAFB] dark:bg-gray-900 p-8 overflow-hidden transition-colors duration-300">
                        <div className="mb-8">
                            <p className="text-xs text-gray-500 dark:text-gray-400 mb-1">Jobs / Marketing manager</p>
                            <h1 className="font-sora text-3xl font-bold text-gray-900 dark:text-white">Marketing manager</h1>
                            <div className="flex gap-8 mt-8 border-b border-gray-200 dark:border-gray-700">
                                <button className="pb-3 border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 font-medium text-sm transition-all">Applications</button>
                                <button className="pb-3 text-gray-500 dark:text-gray-400 text-sm hover:text-gray-700 dark:hover:text-gray-200 transition-all">Details</button>
                                <button className="pb-3 text-gray-500 dark:text-gray-400 text-sm hover:text-gray-700 dark:hover:text-gray-200 transition-all">Notes</button>
                            </div>
                        </div>

                        <div className="flex-1 flex gap-6 overflow-x-auto pb-6 hide-scrollbar">
                            {stages.map((stage, sIdx) => (
                                <div key={sIdx} className="flex-shrink-0 w-72">
                                    <div className="flex items-center gap-2 mb-6">
                                        <h3 className="font-sora font-bold text-gray-400 dark:text-gray-500 text-[10px] uppercase tracking-widest">{stage}</h3>
                                        <span className="text-[10px] font-bold text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded-full">{activeApps.filter(app => app.stage === sIdx).length}</span>
                                    </div>
                                    <div className="flex flex-col gap-4">
                                        {activeApps.filter(app => app.stage === sIdx).map(app => (
                                            <div key={app.id} className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 hover:shadow-md hover:-translate-y-1 transition-all cursor-pointer group">
                                                <h4 className="font-sora font-bold text-gray-900 dark:text-white text-sm mb-1 group-hover:text-indigo-600 transition-colors">{app.name}</h4>
                                                <p className="text-[10px] text-gray-500 dark:text-gray-400 mb-4">{app.title}</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {app.tags?.map((tag, tIdx) => (

                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700">
                                <h3 className="font-sora font-bold text-gray-900 dark:text-white text-sm">Senior Frontend Engineer</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">TechCorp Inc. • 2021 - Present</p>
                                <p className="text-sm text-gray-600 dark:text-gray-300 mt-2">Led the frontend development of the core ATS product using React and Tailwind.</p>
                            </div>
                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700">
                                <h3 className="font-sora font-bold text-gray-900 dark:text-white text-sm">UI/UX Developer</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">Creative Solutions • 2018 - 2021</p>
                                <p className="text-sm text-gray-600 dark:text-gray-300 mt-2">Designed and implemented high-conversion landing pages.</p>
                            </div>
                        </div>
                    </div>

                    <div className="px-6 mb-6">
                        <h2 className="font-sora text-lg font-bold mb-4 text-gray-900 dark:text-white">Education</h2>
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700">
                            <h3 className="font-sora font-bold text-gray-900 dark:text-white text-sm">B.Tech in Computer Science</h3>
                            <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">Indian Institute of Technology • Completed 2018</p>
                        </div>
                    </div>

                    <div className="px-6 mb-6">
                        <h2 className="font-sora text-lg font-bold mb-4 text-gray-900 dark:text-white">Settings</h2>
                        <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 flex justify-between items-center transition-colors duration-300">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-600">
                                    <i data-lucide="monitor" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h3 className="font-sora font-bold text-gray-900 dark:text-white text-sm">Desktop View</h3>
                                    <p className="text-xs text-gray-500 dark:text-gray-400">Switch to full width layout</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setIsMobileView(!isMobileView)}
                                className={`w-12 h-6 rounded-full relative transition-colors duration-300 ${!isMobileView ? 'bg-gradient-to-r from-pink-400 to-yellow-400' : 'bg-gray-200 dark:bg-gray-600'}`}
                            >
                                <div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform duration-300 ${!isMobileView ? 'translate-x-6' : 'translate-x-0.5'}`}></div>
                            </button>
                        </div>

                        <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 flex justify-between items-center mt-3">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-gray-50 dark:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300">
                                    <i data-lucide="moon" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h3 className="font-sora font-bold text-gray-900 dark:text-white text-sm">Dark Theme</h3>
                                    <p className="text-xs text-gray-500 dark:text-gray-400">Switch to dark mode</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className={`w-12 h-6 rounded-full relative transition-colors duration-300 ${isDarkMode ? 'bg-gradient-to-r from-pink-400 to-yellow-400' : 'bg-gray-200 dark:bg-gray-600'}`}
                            >
                                <div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform duration-300 ${isDarkMode ? 'translate-x-6' : 'translate-x-0.5'}`}></div>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const LoginPage = ({ onLogin }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin({ name: 'Alex Kumar', email });
            };

            return (
                <div className="flex-1 flex flex-col items-center justify-center p-6 bg-white dark:bg-gray-900 min-h-screen transition-colors duration-300">
                    <div className="w-full max-w-md animate-fade-in">
                        <div className="flex items-center gap-3 mb-12 justify-center">
                            <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 dark:shadow-none">
                                <i data-lucide="layers" className="w-8 h-8"></i>
                            </div>
                            <h1 className="font-sora text-3xl font-bold text-gray-900 dark:text-white">Align Flow</h1>
                        </div>

                        <div className="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 transition-colors duration-300">
                            <h2 className="font-sora text-2xl font-bold text-gray-900 dark:text-white mb-2">
                                {isLogin ? 'Welcome back' : 'Create account'}
                            </h2>
                            <p className="text-gray-500 dark:text-gray-400 mb-8 text-sm">
                                {isLogin ? 'Please enter your details to sign in.' : 'Start your journey with us today.'}
                            </p>

                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Email Address</label>
                                    <div className="relative">
                                        <i data-lucide="mail" className="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                        <input 
                                            type="email" 
                                            required
                                            value={email}
                                            onChange={e => setEmail(e.target.value)}
                                            placeholder="hello@example.com" 
                                            className="w-full bg-gray-50 dark:bg-gray-700 border-none rounded-2xl py-3.5 pl-12 pr-4 text-sm focus:ring-2 focus:ring-indigo-500 outline-none dark:text-white transition-all"
                                        />
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Password</label>
                                    <div className="relative">
                                        <i data-lucide="lock" className="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                                        <input 
                                            type="password" 
                                            required
                                            value={password}
                                            onChange={e => setPassword(e.target.value)}
                                            placeholder="••••••••" 
                                            className="w-full bg-gray-50 dark:bg-gray-700 border-none rounded-2xl py-3.5 pl-12 pr-4 text-sm focus:ring-2 focus:ring-indigo-500 outline-none dark:text-white transition-all"
                                        />
                                    </div>
                                </div>

                                <button type="submit" className="w-full bg-gradient-to-r from-pink-400 to-yellow-400 text-white font-bold py-4 rounded-2xl shadow-lg shadow-pink-200 dark:shadow-none hover:scale-[1.02] transition-transform mt-4">
                                    {isLogin ? 'Sign In' : 'Sign Up'}
                                </button>
                            </form>

                            <div className="mt-8 flex items-center gap-4">
                                <div className="flex-1 h-[1px] bg-gray-100 dark:bg-gray-700"></div>
                                <span className="text-xs text-gray-400 font-medium">OR</span>
                                <div className="flex-1 h-[1px] bg-gray-100 dark:bg-gray-700"></div>
                            </div>

                            <div className="mt-6 grid grid-cols-2 gap-4">
                                <button className="flex items-center justify-center gap-2 py-3 border border-gray-100 dark:border-gray-700 rounded-2xl hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                    <img src="https://www.google.com/favicon.ico" className="w-4 h-4" alt="Google" />
                                    <span className="text-sm font-medium text-gray-600 dark:text-gray-300">Google</span>
                                </button>
                                <button className="flex items-center justify-center gap-2 py-3 border border-gray-100 dark:border-gray-700 rounded-2xl hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                                    <i data-lucide="github" className="w-4 h-4 text-gray-900 dark:text-white"></i>
                                    <span className="text-sm font-medium text-gray-600 dark:text-gray-300">Github</span>
                                </button>
                            </div>
                        </div>

                        <p className="text-center mt-8 text-sm text-gray-500 dark:text-gray-400">
                            {isLogin ? "Don't have an account?" : "Already have an account?"}
                            <button onClick={() => setIsLogin(!isLogin)} className="ml-2 font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
                                {isLogin ? 'Sign Up' : 'Sign In'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('home');
            const [selectedJob, setSelectedJob] = useState(null);
            const [isMobileView, setIsMobileView] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [appliedJobs, setAppliedJobs] = useState([]);

            useEffect(() => {
                // Initialize lucide icons whenever component renders
                lucide.createIcons();
                
                // Handle Dark Mode Class on document element
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                // Custom event listener for internal navigation
                const handleNav = (e) => setActiveTab(e.detail);
                window.addEventListener('navigate', handleNav);
                return () => window.removeEventListener('navigate', handleNav);
            }, [isDarkMode]);

            return (
                <div className={`h-full w-full relative flex transition-all duration-300 ${isDarkMode ? 'dark bg-gray-900 text-white' : 'bg-gradient-to-br from-pink-50 to-yellow-50'} shadow-2xl overflow-hidden`}>
                    {!isLoggedIn ? (
                        <LoginPage onLogin={(userData) => { setUser(userData); setIsLoggedIn(true); }} />
                    ) : (
                        <>
                            {!isMobileView && <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />}
                            
                            <div className={`flex-1 flex flex-col h-full overflow-hidden relative ${isMobileView ? 'max-w-md mx-auto bg-white dark:bg-gray-900 shadow-2xl' : ''}`}>
                                <CustomCursor />
                                {!isMobileView && <TopBar />}
                                
                                <div className="flex-1 overflow-y-auto relative">
                                    {activeTab === 'home' && <HomeFeed navigateToJob={setSelectedJob} />}
                                    {activeTab === 'tracking' && <ApplicationTracking appliedJobs={appliedJobs} isMobileView={isMobileView} />}
                                    {activeTab === 'activities' && <Activities />}
                                    {activeTab === 'performance' && <Performance />}
                                    {activeTab === 'contacts' && <Contacts />}
                                    {activeTab === 'messages' && <Messages />}
                                    {activeTab === 'profile' && <UserProfile isMobileView={isMobileView} setIsMobileView={setIsMobileView} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} />}
                                    
                                    {selectedJob && <JobDetail job={selectedJob} goBack={() => setSelectedJob(null)} hasApplied={appliedJobs.includes(selectedJob.id)} onApply={(id) => setAppliedJobs([...appliedJobs, id])} />}
                                </div>
                                
                                {isMobileView && !selectedJob && <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
